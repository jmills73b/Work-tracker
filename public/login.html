<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · Work Tracker</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f13" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/app.css">
  <script src="/login.js" type="module"></script>
</head>
<body class="auth-page">
  <main class="auth-main">
    <div class="auth-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
      <span>Work Tracker</span>
    </div>

    <div id="login-view">
      <div class="card">
        <h1>Sign in</h1>
        <form id="login-form">
          <label class="field">
            <span>Email</span>
            <input class="input" name="email" type="email" autocomplete="username" required>
          </label>
          <label class="field">
            <span>Password</span>
            <input class="input" name="password" type="password" autocomplete="current-password" required>
          </label>
          <p class="form-error" id="login-error" role="alert" hidden></p>
          <button class="btn primary block" type="submit">Sign in</button>
        </form>
      </div>
      <button class="btn secondary" type="button" id="show-register">Create an account</button>
    </div>

    <div id="register-view" hidden>
      <div class="card">
        <h1>Create an account</h1>
        <form id="register-form">
          <label class="field">
            <span>Name</span>
            <input class="input" name="name" autocomplete="name" required>
          </label>
          <label class="field">
            <span>Email</span>
            <input class="input" name="email" type="email" autocomplete="username" required>
          </label>
          <label class="field">
            <span>Password</span>
            <input class="input" name="password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <label class="field">
            <span>Confirm password</span>
            <input class="input" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <label class="field">
            <span>Invite code</span>
            <input class="input" name="invite_code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX">
          </label>
          <p class="form-error" id="register-error" role="alert" hidden></p>
          <button class="btn primary block" type="submit">Create account</button>
        </form>
      </div>
      <button class="btn secondary" type="button" id="show-login">I already have an account</button>
    </div>
  </main>
</body>
</html>
