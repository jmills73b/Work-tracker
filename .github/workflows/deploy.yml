name: Test and deploy

# Tests run on every push and pull request. On main, a green run then applies
# migrations and deploys. A failure at either test layer stops the deploy before any
# migration touches the production database.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (local Worker + fresh local D1, no credentials)
        run: npm run test:e2e

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Tests passed. Skipping deploy: add the CLOUDFLARE_API_TOKEN repository secret to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.token.outputs.ready == 'true'

      - name: Make sure the database and workers.dev subdomain exist
        if: steps.token.outputs.ready == 'true'
        run: npm run cf:ensure

      - name: Apply migrations
        if: steps.token.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply work-tracker --remote

      - name: Deploy
        if: steps.token.outputs.ready == 'true'
        run: npx wrangler deploy

      - name: Make sure the reminders key pair exists
        if: steps.token.outputs.ready == 'true'
        run: node scripts/ensure-vapid.mjs

      - name: Smoke test the live site
        if: steps.token.outputs.ready == 'true'
        run: |
          # A brand-new workers.dev address can take a minute to answer.
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$WORKER_URL/login" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "GET $WORKER_URL/login -> $code"
          [ "$code" = "200" ]
          gate=$(curl -s -o /dev/null -w '%{http_code}' "$WORKER_URL/api/tasks")
          echo "GET $WORKER_URL/api/tasks without a session -> $gate"
          [ "$gate" = "401" ]
          echo "### Live at $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the database id to the repo
        if: steps.token.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          if ! git diff --cached --quiet; then
            git commit -m "Save Cloudflare database id [skip ci]"
            git push
          fi
