name: Deploy to Cloudflare

# Runs on every push to main, or manually from the Actions tab.
# Repository secrets: CLOUDFLARE_API_TOKEN, LOGIN_USERNAME, LOGIN_PASSWORD.
# The login secrets are only used the first time, or when "Reset password" is ticked.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset_password:
        description: Reset the login to LOGIN_USERNAME / LOGIN_PASSWORD (signs out everywhere)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
      RESET_PASSWORD: ${{ inputs.reset_password && 'true' || 'false' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Skipping deploy: add the CLOUDFLARE_API_TOKEN repository secret first."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Set up Cloudflare and deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npm run setup

      - name: Save database ID to the repo
        if: steps.secrets.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          if ! git diff --cached --quiet; then
            git commit -m "Save Cloudflare database ID [skip ci]"
            git push
          fi
