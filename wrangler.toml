name = "work-tracker"
main = "src/index.js"
compatibility_date = "2025-09-01"

# The Worker runs first on every request so the page gate in src/index.js sees it,
# then hands public or signed-in requests to these static files.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

# The VAPID key pair is the secret VAPID_PRIVATE_JWK (set once by scripts/ensure-vapid.mjs).
[vars]
VAPID_SUBJECT = "https://work-tracker.jmills1983-1aa.workers.dev"

# Every 15 minutes: send each user's morning digest once their local digest time passes.
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "work-tracker"
database_id = "e12af7da-e7ba-4634-b756-cba34b4e165c"   # filled in by scripts/ensure-cloudflare.mjs
migrations_dir = "migrations"
