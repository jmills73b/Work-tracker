name = "work-tracker"
compatibility_date = "2025-09-01"
pages_build_output_dir = "public"

# Secrets (set by scripts/setup-cloudflare.mjs, never stored in this repo):
#   AUTH_PEPPER - server-side key mixed into password hashes

[[d1_databases]]
binding = "DB"
database_name = "work-tracker"
database_id = "00000000-0000-0000-0000-000000000000"   # filled in by the setup script
migrations_dir = "migrations"
